<!-- 문의하기 -->
<section class="sub-hero" style="background-image:url('assets/img/sub-hero-about.jpg')">
  <p class="en">About Us</p>
  <h1>문의하기</h1>
</section>

<section class="contact">
  <div class="wrap contact-grid">
    <div>
      <p class="sec-eyebrow">Contact Us</p>
      <h2>스테가비전은 기술을 넘어<br>신뢰를 설계합니다.</h2>
      <p class="note">우측 버튼이나 이메일로 문의주시면 확인 후 답변 드리겠습니다.</p>
      <ul class="contact-list">
        <li><img src="assets/img/icon-phone.png" alt=""><b>전 화</b><a href="tel:{{phone}}">{{phone}}</a></li>
        <li><img src="assets/img/icon-mail.png" alt=""><b>이메일</b><a href="mailto:{{email}}">{{email}}</a></li>
        <li><img src="assets/img/icon-pin.png" alt=""><b>주 소</b><span>{{address}}</span></li>
      </ul>
      <div class="map-box">
        지도를 불러오는 중입니다. 보이지 않으면 아래 링크를 이용해 주세요.
        <iframe title="스테가비전 위치 지도" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=%EA%B2%BD%EC%83%81%EB%B6%81%EB%8F%84+%EA%B2%BD%EC%82%B0%EC%8B%9C+%EB%8C%80%ED%95%99%EB%A1%9C+280&z=16&hl=ko&output=embed"></iframe>
      </div>
      <p class="map-links">
        <a href="https://map.naver.com/p/search/%EA%B2%BD%EC%83%81%EB%B6%81%EB%8F%84%20%EA%B2%BD%EC%82%B0%EC%8B%9C%20%EB%8C%80%ED%95%99%EB%A1%9C%20280" target="_blank" rel="noopener">네이버 지도에서 보기</a>
        <a href="https://map.kakao.com/?q=%EA%B2%BD%EC%83%81%EB%B6%81%EB%8F%84%20%EA%B2%BD%EC%82%B0%EC%8B%9C%20%EB%8C%80%ED%95%99%EB%A1%9C%20280" target="_blank" rel="noopener">카카오맵에서 보기</a>
      </p>
    </div>
    <div class="mailbox">
      <h3>이메일 문의</h3>
      <p>아래 내용을 함께 적어 보내 주시면 빠르게 답변 드리겠습니다.</p>
      <ul>
        <li>회사명</li>
        <li>성함</li>
        <li>연락처</li>
        <li>문의 내용</li>
      </ul>
      <a class="btn-mail" href="mailto:{{email}}?subject=%5B%EC%8A%A4%ED%85%8C%EA%B0%80%EB%B9%84%EC%A0%84%20%EB%AC%B8%EC%9D%98%5D&body=%ED%9A%8C%EC%82%AC%EB%AA%85%3A%20%0A%EC%84%B1%ED%95%A8%3A%20%0A%EC%97%B0%EB%9D%BD%EC%B2%98%3A%20%0A%EB%AC%B8%EC%9D%98%20%EB%82%B4%EC%9A%A9%3A%20%0A">문의하기</a>
      <p class="addr">{{email}}</p>
    </div>
  </div>
</section>
